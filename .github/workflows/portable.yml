name: macOS unsigned preview

# On-demand Apple Silicon ZIP. This is intentionally an unsigned/ad-hoc-signed
# preview until Developer ID signing and Apple notarization are configured.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS ARM64 preview
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: test "$(node -p process.arch)" = "arm64"

      - name: Validate lockfile portability
        run: npm run check:lockfile

      - run: npm ci --ignore-scripts=false --dangerously-allow-all-scripts=false --strict-allow-scripts
      - run: npm test

      - name: Package portable app
        run: npm run dist:portable:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate checksums
        run: shasum -a 256 release/*.zip | tee release/SHA256SUMS.txt

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-skill-recorder-macos-arm64-unsigned-preview
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload compliance companion
        uses: actions/upload-artifact@v4
        with:
          name: better-skill-recorder-macos-arm64-compliance
          path: .compliance/**
          include-hidden-files: true
          if-no-files-found: error
